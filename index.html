<!DOCTYPE html>
<html>
<head>
    <title>Under Construction</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .desktop {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .mobile {
            display: none;
        }


        @media screen and (max-width: 768px) {

            .desktop {
                display: none;
            }

            .mobile {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

        }

    </style>

</head>

<body>

    <img class="desktop" src="desktop.png" alt="Desktop version">

    <img class="mobile" src="mobile.png" alt="Mobile version">

</body>
</html>
